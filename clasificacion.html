<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EliteChess - Clasificación</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: white;
            font-family: sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #c4a028;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .botones-categoria {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn-categoria {
            padding: 12px 24px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-categoria:hover {
            background: #333;
            border-color: #666;
        }
        .btn-categoria.activo {
            background: #c4a028;
            color: black;
            border-color: #c4a028;
            font-weight: bold;
        }
        .tabla-clasificacion {
            max-width: 800px;
            margin: 0 auto;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #444;
        }
        .fila-header, .fila-jugador {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 100px 100px;
            padding: 15px;
            border-bottom: 1px solid #333;
            align-items: center;
        }
        .fila-header {
            background: #1a1a00;
            color: #c4a028;
            font-weight: bold;
            border-bottom: 2px solid #c4a028;
        }
        .fila-jugador:hover {
            background: #1a1a1a;
        }
        .fila-jugador.mi-posicion {
            background: #1a1a00;
            border-left: 4px solid #c4a028;
        }
        .posicion {
            font-weight: bold;
            font-size: 1.2em;
        }
        .pos-1 { color: #ffd700; }
        .pos-2 { color: #c0c0c0; }
        .pos-3 { color: #cd7f32; }
        .elo {
            color: #c4a028;
            font-weight: bold;
        }
        .btn-volver {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-volver:hover {
            background: #1976D2;
        }
        .info-mi-posicion {
            text-align: center;
            color: #c4a028;
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🏆 Clasificación EliteChess</h1>
    
    <div class="botones-categoria">
        <button class="btn-categoria" onclick="cargarClasificacion('bullet', this)">⚡ Bullet (1-2 min)</button>
        <button class="btn-categoria activo" onclick="cargarClasificacion('blitz', this)">🔥 Blitz (3-5 min)</button>
        <button class="btn-categoria" onclick="cargarClasificacion('rapid', this)">🎯 Rapid (10+ min)</button>
    </div>
    
    <div class="tabla-clasificacion">
        <div class="fila-header">
            <div>#</div>
            <div>Jugador</div>
            <div>ELO</div>
            <div>Ganadas</div>
            <div>Perdidas</div>
            <div>Tablas</div>
        </div>
        <div id="contenidoTabla">
            <div style="text-align:center;padding:30px;color:#888;">
                Cargando clasificación...
            </div>
        </div>
    </div>
    
    <div class="info-mi-posicion" id="miPosicion"></div>
    
    <button class="btn-volver" onclick="window.location.href='configuracion.html'">
        🏠 Volver al menú
    </button>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let miNick = localStorage.getItem('nickJugador') || '';
        
        socket.on('connect', function() {
            cargarClasificacion('blitz', document.querySelector('.btn-categoria.activo'));
        });
        
        socket.on('clasificacion_response', function(data) {
            const contenido = document.getElementById('contenidoTabla');
            const miPosicionDiv = document.getElementById('miPosicion');
            
            if (data.jugadores.length === 0) {
                contenido.innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Aún no hay jugadores en esta categoría</div>';
                miPosicionDiv.innerText = '';
                return;
            }
            
            let html = '';
            let miPos = null;
            
            data.jugadores.forEach(function(j) {
                let clasePos = '';
                if (j.posicion === 1) clasePos = 'pos-1';
                else if (j.posicion === 2) clasePos = 'pos-2';
                else if (j.posicion === 3) clasePos = 'pos-3';
                
                let claseFila = '';
                if (j.nick.toLowerCase() === miNick.toLowerCase()) {
                    claseFila = 'mi-posicion';
                    miPos = j.posicion;
                }
                
                html += `
                    <div class="fila-jugador ${claseFila}">
                        <div class="posicion ${clasePos}">${j.posicion}</div>
                        <div>${j.nick}</div>
                        <div class="elo">${j.elo}</div>
                        <div>${j.ganadas}</div>
                        <div>${j.perdidas}</div>
                        <div>${j.tablas}</div>
                    </div>
                `;
            });
            
            contenido.innerHTML = html;
            
            if (miPos) {
                miPosicionDiv.innerText = `📍 Tu posición: #${miPos}`;
            } else {
                miPosicionDiv.innerText = ' No estás en el top 50';
            }
        });
        
        function cargarClasificacion(categoria, boton) {
            // Actualizar botones activos
            document.querySelectorAll('.btn-categoria').forEach(function(btn) {
                btn.classList.remove('activo');
            });
            if (boton) boton.classList.add('activo');
            
            socket.emit('obtener_clasificacion', { categoria: categoria });
        }
    </script>
</body>
</html>
